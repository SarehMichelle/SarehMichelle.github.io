name: Unpack site
on:
  push:
    paths: ['site.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace site files with the contents of site.zip
        run: |
          set -e
          mkdir /tmp/site
          unzip -q site.zip -d /tmp/site
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish OutVenture Media site"
          git push
